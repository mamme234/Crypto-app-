<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mini GTA Web</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
}

canvas { display: block; }

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  background: rgba(0,0,0,0.5);
  padding: 10px;
  border-radius: 10px;
  z-index: 10;
}

/* 📱 MOBILE CONTROLS */
#controls {
  position: absolute;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 10;
}

.btn {
  width: 70px;
  height: 70px;
  background: rgba(255,255,255,0.2);
  color: white;
  border-radius: 50%;
  text-align: center;
  line-height: 70px;
  font-size: 18px;
  user-select: none;
}
</style>
</head>

<body>

<div id="ui">
  <h3>Mini GTA Web</h3>
  <p>Move + Drive + Mobile</p>
</div>

<!-- mobile buttons -->
<div id="controls">
  <div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
  </div>

  <div>
    <div class="btn" id="up">▲</div>
    <div class="btn" id="down">▼</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="main.js"></script>

</body>
</html>
